<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ReadFollow Shortcut Keys</title>
  <link rel="stylesheet" type="text/css" href="css/tokens.css">
  <link rel="stylesheet" type="text/css" href="css/base.css">
  <link rel="stylesheet" type="text/css" href="css/options.css">
  <style>
  kbd {
    padding: 2px 6px;
    font-family: var(--rf-font-mono);
    font-size: 0.85em;
    background-color: var(--rf-surface-2);
    border: 1px solid var(--rf-border);
    border-radius: 4px;
  }
  </style>
  <script src="js/rxjs.umd.min.js"></script>
  <script src="js/defaults.js"></script>
</head>
<body>
  <main class="container">
    <header class="rf-header">
      <img src="img/icon.svg" alt="">
      <h1 class="rf-title">Shortcut keys</h1>
    </header>
    <table class="table">
      <tr>
        <td>Play/Pause</td>
        <td><kbd>Alt/Option</kbd> + <kbd>P</kbd></td>
      </tr>
      <tr>
        <td>Play/Stop</td>
        <td><kbd>Alt/Option</kbd> + <kbd>O</kbd></td>
      </tr>
      <tr>
        <td>Forward</td>
        <td><kbd>Alt/Option</kbd> + <kbd>Period</kbd></td>
      </tr>
      <tr>
        <td>Rewind</td>
        <td><kbd>Alt/Option</kbd> + <kbd>Comma</kbd></td>
      </tr>
    </table>
  </main>
</body>
</html>
