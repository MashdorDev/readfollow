<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ReadFollow</title>

  <link rel="stylesheet" type="text/css" href="css/tokens.css">
  <link rel="stylesheet" type="text/css" href="css/base.css">
  <link rel="stylesheet" type="text/css" href="css/popup.css">

  <script src="js/rxjs.umd.min.js"></script>
  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/defaults.js"></script>
  <script src="js/messaging.js"></script>
  <script src="js/popup.js"></script>
</head>
<body>
  <header id="popup-header">
    <img src="img/icon.svg" alt="" width="22" height="22">
    <span id="popup-name" data-i18n="extension_short_name"></span>
    <button type="button" id="btnSettings" class="icon-button" data-i18n-title="popup_settings_button">
      <i class="material-icons" aria-hidden="true">settings</i>
    </button>
  </header>

  <div id="buttons" role="group" data-i18n-aria-label="popup_controls_label">
    <button type="button" id="btnRewind" class="icon-button" data-i18n-title="popup_rewind_button">
      <i class="material-icons" aria-hidden="true">skip_previous</i>
    </button>
    <span id="imgLoading" class="main-button loading" role="img" data-i18n-aria-label="popup_loading">
      <span class="spinner"></span>
    </span>
    <button type="button" id="btnPlay" class="main-button" data-i18n-title="popup_play_button">
      <i class="material-icons" aria-hidden="true">play_arrow</i>
    </button>
    <button type="button" id="btnPause" class="main-button" data-i18n-title="popup_pause_button">
      <i class="material-icons" aria-hidden="true">pause</i>
    </button>
    <button type="button" id="btnForward" class="icon-button" data-i18n-title="popup_forward_button">
      <i class="material-icons" aria-hidden="true">skip_next</i>
    </button>
    <button type="button" id="btnStop" class="icon-button" data-i18n-title="popup_stop_button">
      <i class="material-icons" aria-hidden="true">stop</i>
    </button>
  </div>

  <div id="status" role="status" aria-live="polite"></div>

  <div id="quick-settings">
    <label for="speed" data-i18n="options_rate_label"></label>
    <select id="speed" class="form-control"></select>
    <span id="voice-label" data-i18n="options_voice_label"></span>
    <button type="button" id="voice-name" class="link-button" aria-describedby="voice-label"></button>
  </div>

  <div id="highlight" aria-live="off"></div>
  <div id="toolbar">
    <div class="btn-group">
      <button id="decrease-font-size" type="button" class="btn btn-sm btn-light" data-i18n-title="popup_smaller_text">A-</button>
      <button id="increase-font-size" type="button" class="btn btn-sm btn-light" data-i18n-title="popup_larger_text">A+</button>
    </div>
    <div class="btn-group window-size">
      <button id="decrease-window-size" type="button" class="btn btn-sm btn-light" data-i18n-title="popup_smaller_window">
        <i class="material-icons" aria-hidden="true">remove</i>
      </button>
      <button id="increase-window-size" type="button" class="btn btn-sm btn-light" data-i18n-title="popup_larger_window">
        <i class="material-icons" aria-hidden="true">add</i>
      </button>
    </div>
  </div>
</body>
</html>
