name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Publishes the current version without a version change, for the first store submission
  # or to retry one that failed. Stores refuse a version number they already have.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current manifest version to the stores
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    name: Lint extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: for f in js/*.js js/content/*.js tools/*.mjs background.js; do node --check "$f"; done
      - name: Build the Firefox package
        run: node tools/build-firefox.mjs
      # AMO rejects an upload with linter errors; warnings inside the bundled libraries are expected
      - name: web-ext lint
        run: npx --yes web-ext@8 lint --source-dir build/firefox

  piper:
    name: Piper bundle matches its source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: piper/package-lock.json
      - name: Rebuild vendor/piper from piper/
        working-directory: piper
        run: npm ci && npm run build
      - name: Compare with the committed build
        run: git diff --exit-code --stat -- vendor/piper

  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: [lint, piper]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chrome package
        run: |
          mkdir -p build
          zip -qr build/readfollow-chrome.zip _locales css img js sound vendor *.html manifest.json background.js -x '*.map'
      - name: Firefox package
        run: |
          node tools/build-firefox.mjs
          npx --yes web-ext@8 build --source-dir build/firefox --artifacts-dir build --filename readfollow-firefox.zip --overwrite-dest
      # AMO asks for the source of the minified Piper bundle; this is the repository at this commit
      - name: Source archive
        run: git archive --format=zip -o build/readfollow-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ github.sha }}
          path: build/*.zip
          retention-days: 14

  # Store deploys and the GitHub Release run when manifest.json's version changes on a push to main,
  # or when the workflow is run by hand with "publish" ticked.
  detect-version:
    name: Detect version bump
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          CURRENT="$(node -p "require('./manifest.json').version")"
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing $CURRENT by hand."
            exit 0
          fi
          PREVIOUS=""
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
             && git cat-file -e "${BEFORE}:manifest.json" 2>/dev/null; then
            PREVIOUS="$(git show "${BEFORE}:manifest.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          fi
          echo "Previous version: '${PREVIOUS:-<none>}' | Current version: '$CURRENT'"
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-firefox:
    name: Publish to Firefox (AMO)
    runs-on: ubuntu-latest
    needs: [build, detect-version]
    if: needs.detect-version.outputs.changed == 'true'
    outputs:
      published: ${{ steps.sign.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: packages-${{ github.sha }}
          path: ./artifact
      # Until the AMO secrets are added to this repository, a version bump publishes nothing
      - name: web-ext sign --channel=listed
        id: sign
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::warning::AMO secrets are not set; skipping the Firefox publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node tools/build-firefox.mjs
          npx --yes web-ext@8 sign \
            --source-dir build/firefox \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET" \
            --channel=listed \
            --amo-metadata=amo-metadata.json \
            --upload-source-code=./artifact/readfollow-source.zip
          echo "published=true" >> "$GITHUB_OUTPUT"

  deploy-chrome:
    name: Publish to Chrome Web Store
    runs-on: ubuntu-latest
    needs: [deploy-firefox, detect-version, build]
    if: needs.detect-version.outputs.changed == 'true'
    steps:
      # The item has to exist first: the first upload is done by hand in the dashboard,
      # which gives the CWS_EXTENSION_ID secret its value
      - name: Check Chrome Web Store credentials
        id: check
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
        run: |
          if [ -z "$CWS_EXTENSION_ID" ] || [ -z "$CWS_CLIENT_ID" ]; then
            echo "::warning::Chrome Web Store secrets are not set; skipping the Chrome publish."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          name: packages-${{ github.sha }}
          path: ./artifact
      - name: Upload to Chrome Web Store
        if: steps.check.outputs.ready == 'true'
        uses: mnao305/chrome-extension-upload@fdfe79400af990f5145a319e834aee64907ccff4 # v6.0.0
        with:
          file-path: ./artifact/readfollow-chrome.zip
          extension-id: ${{ secrets.CWS_EXTENSION_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}

  # A GitHub Release with the Chrome package, the AMO-signed .xpi and the source archive,
  # once Firefox has published this version
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [deploy-firefox, deploy-chrome, detect-version, build]
    if: ${{ !cancelled() && needs.deploy-firefox.outputs.published == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages-${{ github.sha }}
          path: ./artifact
      # AMO allows a version number once per add-on, so the .xpi is the listed one AMO signed, not a second signing.
      # A new listed version waits for review, so it may not be served yet; the release goes out without it then.
      - name: Fetch the AMO-signed .xpi
        env:
          VERSION: ${{ needs.detect-version.outputs.version }}
        run: |
          API="https://addons.mozilla.org/api/v5/addons/addon/readfollow@dorzairi.dev/"
          for i in $(seq 1 20); do
            body=$(curl -sS "$API" || true)
            live=$(printf '%s' "$body" | python3 -c "import sys,json;print(json.load(sys.stdin)['current_version']['version'])" 2>/dev/null || true)
            if [ "$live" = "$VERSION" ]; then
              url=$(printf '%s' "$body" | python3 -c "import sys,json;print(json.load(sys.stdin)['current_version']['file']['url'])")
              curl -sSL --fail -o "./artifact/readfollow-$VERSION.xpi" "$url"
              exit 0
            fi
            echo "AMO serving '${live:-nothing yet}', waiting for $VERSION ($i/20)"
            sleep 15
          done
          echo "::warning::AMO did not serve $VERSION within 5 minutes (a new version may still be in review); releasing without the .xpi"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version.outputs.version }}
          name: v${{ needs.detect-version.outputs.version }}
          generate_release_notes: true
          files: ./artifact/*
