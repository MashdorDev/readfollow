<!DOCTYPE html>
<!-- Chrome Web Store small promo tile, 440x280 -->
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
    body {
      display: flex; flex-direction: column; justify-content: center; gap: 14px;
      padding: 0 40px; box-sizing: border-box;
      background: #0f766e; color: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .name { display: flex; align-items: center; gap: 14px; font-size: 38px; font-weight: 650; letter-spacing: -0.02em; }
    .name svg { width: 52px; height: 52px; }
    .line { font-size: 19px; line-height: 1.35; color: #cdeae6; }
    .line mark { background: #ffc933; color: #1f2328; padding: 0 3px; border-radius: 3px; text-decoration: underline 2px #1f2328; text-underline-offset: 2px; }
  </style>
</head>
<body>
  <div class="name">
    <svg viewBox="0 0 128 128" aria-hidden="true">
      <rect x="4" y="4" width="120" height="120" rx="28" fill="#ffffff" fill-opacity="0.14"/>
      <rect x="26" y="34" width="76" height="12" rx="6" fill="#cdeae6"/>
      <rect x="26" y="58" width="28" height="12" rx="6" fill="#cdeae6"/>
      <rect x="60" y="54" width="42" height="20" rx="7" fill="#ffc933"/>
      <rect x="26" y="82" width="56" height="12" rx="6" fill="#cdeae6"/>
    </svg>
    ReadFollow
  </div>
  <div class="line">Text to speech that highlights each <mark>word</mark> as it is read</div>
</body>
</html>
