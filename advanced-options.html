<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ReadFollow Advanced Settings</title>
  <link rel="icon" type="image/svg+xml" href="img/icon.svg">
  <link rel="stylesheet" type="text/css" href="css/tokens.css">
  <link rel="stylesheet" type="text/css" href="css/base.css">
  <link rel="stylesheet" type="text/css" href="css/options.css">

  <script src="js/rxjs.umd.min.js"></script>
  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/defaults.js"></script>
  <script src="js/advanced-options.js"></script>
</head>
<body>
  <main class="container">
    <header class="rf-header">
      <img src="img/icon.svg" alt="">
      <h1 class="rf-title" data-i18n="extension_short_name"></h1>
    </header>

    <nav>
      <ul class="rf-nav">
        <li><a href="options.html" data-i18n="nav_settings"></a></li>
        <li><a href="languages.html" data-i18n="nav_languages"></a></li>
        <li><a href="custom-voices.html" data-i18n="nav_custom_voices"></a></li>
        <li><a href="advanced-options.html" aria-current="page" data-i18n="nav_advanced"></a></li>
        <li><a href="about.html" data-i18n="nav_about"></a></li>
      </ul>
    </nav>

    <section class="rf-section" id="advanced-options">
      <h2 data-i18n="advanced_playback_title"></h2>
      <div>
        <input type="checkbox" id="fix-bt-silence-gap">
        <label for="fix-bt-silence-gap" data-i18n="advanced_bt_silence_gap"></label>
      </div>
    </section>

    <section class="rf-section" id="word-replacements-section">
      <div id="word-replacements-header">
        <h2 id="word-replacements-title" data-i18n="advanced_word_replacements_title"></h2>
        <span id="word-replacements-status" class="text-muted" role="status"></span>
      </div>
      <textarea id="word-replacements" class="form-control" rows="8" spellcheck="false"
        aria-labelledby="word-replacements-title"
        aria-describedby="word-replacements-errors"></textarea>
      <ul id="word-replacements-errors" aria-live="polite"></ul>
    </section>
  </main>
</body>
</html>
